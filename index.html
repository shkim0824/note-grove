<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src https://api.github.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<meta name="application-version" content="2026.10.29-1">
<title>Note Grove · 나의 연구 노트</title>
<style>
:root{
  --ink:#37352f;--ink2:#787774;--ink3:#9b9a97;--line:#e9e9e7;--line2:#dfdfdc;--hover:#efefed;--side:#f7f7f5;--bg:#fff;
  --blue:#2383e2;--blue-bg:#e7f3f8;--green-bg:#edf3ec;--purple-bg:#f6f3f9;--yellow-bg:#fbf3db;--red-bg:#fdebec;--gray-bg:#f1f1ef;
  --red:#d44c47;--green:#448361;--code-bg:#f7f6f3;--sel:rgba(35,131,226,.14);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Noto Sans KR",Helvetica,Arial,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:16px/1.6 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
::selection{background:var(--sel)}
kbd{font:12px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff}
[hidden]{display:none!important}

/* layout */
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;font-size:14px;color:#5f5e5b;transition:margin-left .18s}
.app.sb-off .sb{margin-left:-260px}
.sb-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 14px}
.ws{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:14px;padding:4px 6px;border-radius:6px;text-align:left;min-width:0}
.ws:hover{background:var(--hover)}
.ws-logo{width:22px;height:22px;border-radius:5px;background:#e3e2de;display:grid;place-items:center;font-size:13px;flex:none}
.ws-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{width:7px;height:7px;border-radius:50%;background:#c9c8c4;flex:none}
.conn.on{background:#46a36c}.conn.ro{background:#d9a336}.conn.err{background:var(--red)}
.icon-btn{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--ink3);flex:none;font-size:14px}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.sb-acts{padding:2px 8px 8px}
.sb-act{display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;border-radius:5px;color:#5f5e5b;text-align:left}
.sb-act:hover{background:var(--hover)}
.sb-act .ic{width:20px;text-align:center}
.sb-act kbd{margin-left:auto;font-size:10px;color:var(--ink3);background:none;border:0}
.sb-scroll{flex:1;overflow:auto;padding:0 8px 16px}
.sb-sec{margin-top:14px}
.sb-sec-h{display:flex;align-items:center;justify-content:space-between;padding:2px 8px;font-size:12px;font-weight:600;color:var(--ink3);border-radius:5px}
.sb-sec-h:hover{background:var(--hover)}
.sb-sec-h button{opacity:0;width:20px;height:20px;border-radius:4px}
.sb-sec-h:hover button{opacity:1}
.sb-sec-h button:hover{background:#e2e1dd}
.sb-empty{padding:2px 10px 2px 30px;font-size:13px;color:var(--ink3)}
.ti{display:flex;align-items:center;gap:2px;height:30px;padding-left:calc(4px + var(--d,0) * 14px);padding-right:4px;border-radius:5px;cursor:pointer;color:#5f5e5b;position:relative}
.ti:hover{background:var(--hover)}
.ti.on{background:#e8e7e4;color:var(--ink);font-weight:550}
.ti-caret{width:20px;height:20px;border-radius:4px;color:var(--ink3);font-size:10px;display:grid;place-items:center;flex:none;transition:transform .12s}
.ti-caret:hover{background:#e2e1dd}
.ti-caret.open{transform:rotate(90deg)}
.ti-caret.none{visibility:hidden}
.ti-icon{width:22px;text-align:center;flex:none;font-size:15px}
.ti-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-badge{font-size:11px;flex:none;opacity:.85}
.ti-acts{display:none;gap:1px}
.ti:hover .ti-acts{display:flex}
.ti-acts button{width:22px;height:22px;border-radius:4px;color:var(--ink3)}
.ti-acts button:hover{background:#e2e1dd;color:var(--ink)}
.ti.drop-in{box-shadow:inset 0 0 0 2px var(--blue)}
.ti.drop-before::before,.ti.drop-after::after{content:"";position:absolute;left:8px;right:4px;height:2px;background:var(--blue);border-radius:2px}
.ti.drop-before::before{top:-1px}.ti.drop-after::after{bottom:-1px}
.sb-foot{border-top:1px solid var(--line);padding:6px 8px 10px}
.sb-ver{padding:4px 8px 0;font-size:11px;color:var(--ink3)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:45px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
.crumb{padding:2px 6px;border-radius:5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.crumb:hover{background:var(--hover)}
.crumb-sep{color:var(--ink3);padding:0 1px}
.top-r{display:flex;align-items:center;gap:4px;flex:none}
.tbtn{padding:3px 8px;border-radius:5px;color:var(--ink);white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.status{font-size:13px;color:var(--ink3);padding:0 6px;white-space:nowrap}
.status.err{color:var(--red);cursor:pointer}
.vis-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.vis-pill:hover{background:var(--hover)}
.vis-pill.pub{border-color:#c6dfee;background:#f2f8fc}
.banner{margin:0;padding:8px 16px;font-size:13px;background:var(--yellow-bg);color:#6b5a1e;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--blue-bg);color:#24577a}
.banner button{text-decoration:underline}

.scroller{flex:1;overflow:auto;position:relative}
.page{max-width:900px;margin:0 auto;padding:40px 96px 30vh}
.page.wide{max-width:none}
.pg-icon-row{min-height:12px;margin-top:40px}
.pg-icon{font-size:64px;line-height:1.1;border-radius:8px;padding:2px 4px;margin-left:-4px}
.pg-icon:hover{background:var(--hover)}
.pg-add-icon{font-size:14px;color:var(--ink3);padding:3px 6px;border-radius:5px;opacity:0;transition:opacity .15s}
.page:hover .pg-add-icon{opacity:1}
.pg-add-icon:hover{background:var(--hover)}
.pg-title{font-size:40px;line-height:1.2;font-weight:700;margin:6px 0 4px;outline:none;word-break:keep-all;overflow-wrap:anywhere}
.pg-title:empty::before{content:attr(data-ph);color:#e1e0dd}
.pg-meta{font-size:12.5px;color:var(--ink3);margin:2px 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pg-meta a{color:var(--ink3);text-decoration:none}
.pg-meta a:hover{color:var(--ink);text-decoration:underline}
.props{margin:4px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.prop{display:flex;gap:8px;font-size:14px;min-height:30px;align-items:flex-start;border-radius:5px;position:relative}
.prop-k{width:160px;flex:none;color:var(--ink2);padding:4px 6px;border-radius:4px;outline:none}
.prop-v{flex:1;min-width:0;padding:4px 6px;border-radius:4px;outline:none;overflow-wrap:anywhere}
.prop-k:hover,.prop-v:hover{background:var(--hover)}
.prop-del{position:absolute;right:-26px;top:4px;opacity:0;color:var(--ink3);width:20px;height:22px;border-radius:4px}
.prop:hover .prop-del{opacity:1}
.prop-del:hover{background:var(--hover)}
.prop-add{font-size:13px;color:var(--ink3);padding:3px 6px;border-radius:5px;margin-top:2px}
.prop-add:hover{background:var(--hover)}

/* blocks */
.editor{position:relative;padding-bottom:20px}
.blk{position:relative;margin:1px 0}
.gut{position:absolute;left:-50px;top:3px;display:flex;opacity:0;transition:opacity .1s}
.blk:hover>.gut{opacity:1}
.gut button,.gut span{width:22px;height:24px;border-radius:4px;color:#b8b7b3;display:grid;place-items:center;font-size:15px;cursor:pointer;user-select:none}
.gut button:hover,.gut span:hover{background:var(--hover);color:var(--ink2)}
.g-drag{cursor:grab!important;font-size:13px!important;letter-spacing:-2px}
.blk.h1>.gut,.blk.h2>.gut{top:12px}
.blk.dragging{opacity:.35}
.blk.drop-before{box-shadow:0 -2px 0 var(--blue)}
.blk.drop-after{box-shadow:0 2px 0 var(--blue)}
.blk.sel>.bd{background:var(--sel);border-radius:4px}
.txt{outline:none;padding:3px 2px;min-height:1.6em;white-space:pre-wrap;overflow-wrap:anywhere}
.txt:empty:focus::before,.txt.ph:empty::before{content:attr(data-ph);color:var(--ink3);pointer-events:none}
.txt a,.view a{color:inherit;text-decoration:underline;text-decoration-color:rgba(55,53,47,.4);text-underline-offset:2px}
.txt a:hover{text-decoration-color:var(--ink)}
.txt code,.prop-v code,td code,th code,.tg-sum code,summary code{font-family:var(--mono);font-size:85%;background:rgba(135,131,120,.15);color:#eb5757;padding:.15em .35em;border-radius:4px}
.blk.h .txt{font-weight:650;line-height:1.3}
.blk.h1{margin-top:28px}.blk.h1 .txt{font-size:1.875em}
.blk.h2{margin-top:22px}.blk.h2 .txt{font-size:1.5em}
.blk.h3{margin-top:16px}.blk.h3 .txt{font-size:1.25em}
.blk.h4 .txt,.blk.h5 .txt,.blk.h6 .txt{font-size:1.05em}
.li{display:flex;align-items:flex-start}
.mk{flex:none;width:26px;text-align:center;padding-top:3px;user-select:none;color:var(--ink)}
.mk.dot{font-size:1.25em;line-height:1.3}
.mk.num{font-variant-numeric:tabular-nums;width:auto;min-width:26px;padding-right:4px;text-align:right}
.li>.txt{flex:1;min-width:0}
.todo-cb{width:16px;height:16px;margin:7px 6px 0 5px;flex:none;accent-color:var(--blue);cursor:pointer}
.blk.done>.bd>.li>.txt{color:var(--ink3);text-decoration:line-through}
.kids{padding-left:26px}
.blk.toggle>.bd>.kids,.blk.callout .kids,.blk.quote .kids{padding-left:0}
.tg{display:flex;align-items:flex-start}
.tg-arrow{width:24px;height:28px;flex:none;color:var(--ink);font-size:11px;border-radius:4px;transition:transform .12s}
.tg-arrow:hover{background:var(--hover)}
.blk.open>.bd>.tg>.tg-arrow{transform:rotate(90deg)}
.tg>.txt{flex:1;min-width:0;font-weight:500}
.blk.toggle>.bd>.kids{margin-left:24px}
.blk.toggle:not(.open)>.bd>.kids{display:none}
.kid-add{font-size:14px;color:var(--ink3);padding:2px 6px;border-radius:5px;margin:2px 0}
.kid-add:hover{background:var(--hover)}
.qt{border-left:3px solid var(--ink);padding-left:14px;margin:4px 0}
.co{display:flex;gap:10px;padding:14px 16px 12px 12px;border-radius:6px;background:var(--gray-bg);margin:6px 0}
.co.NOTE{background:var(--blue-bg)}.co.TIP{background:var(--green-bg)}.co.IMPORTANT{background:var(--purple-bg)}.co.WARNING{background:var(--yellow-bg)}.co.CAUTION{background:var(--red-bg)}
.co-ic{font-size:20px;line-height:1.2;width:28px;height:28px;border-radius:5px;flex:none;display:grid;place-items:center}
.co-ic:hover{background:rgba(0,0,0,.06)}
.co-body{flex:1;min-width:0}
.co-label{font-size:12px;font-weight:600;letter-spacing:.3px;margin:2px 0 0 2px;opacity:.75}
.cb{background:var(--code-bg);border-radius:6px;margin:6px 0;position:relative}
.cb-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0 14px;font-size:12px;color:var(--ink3)}
.cb-lang{border:0;background:transparent;font-size:12px;color:var(--ink3);width:140px;padding:2px 4px;border-radius:4px}
.cb-lang:hover,.cb-lang:focus{background:rgba(0,0,0,.05);outline:none}
.cb-copy{font-size:12px;padding:2px 6px;border-radius:4px;color:var(--ink3)}
.cb-copy:hover{background:rgba(0,0,0,.06)}
.cb-code{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;font:13.5px/1.6 var(--mono);padding:8px 16px 14px;tab-size:2;white-space:pre;overflow:auto hidden;min-height:2.4em}
pre.cb-code{margin:0}
.mm{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:10px}
.mm-view{display:flex;justify-content:center;overflow:auto;min-height:40px}
.mm-view svg{max-width:100%;height:auto}
.mm-err{font:12px var(--mono);color:var(--red);white-space:pre-wrap}
.mm-src summary{font-size:12px;color:var(--ink3);cursor:pointer;margin-top:6px;width:max-content}
.mm-src .cb-code{background:var(--code-bg);border-radius:6px;margin-top:6px}
.tb-wrap{overflow-x:auto;margin:6px 0 4px;position:relative}
.tbl{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left;min-width:60px;outline:none;line-height:1.5;overflow-wrap:anywhere}
.tbl th{background:#f7f7f5;font-weight:600}
.tbl .nw{white-space:nowrap}
.tbl td:focus,.tbl th:focus{box-shadow:inset 0 0 0 2px #74b6f0}
.tbl [data-align=center]{text-align:center}.tbl [data-align=right]{text-align:right}
.tb-tools{display:flex;gap:4px;opacity:0;margin-top:2px}
.blk.table:hover .tb-tools{opacity:1}
.tb-tools button{font-size:12px;color:var(--ink3);padding:1px 7px;border-radius:4px}
.tb-tools button:hover{background:var(--hover);color:var(--ink)}
.hr-wrap{padding:10px 0}.hr-wrap hr{border:0;border-top:1px solid var(--line2);margin:0}
.img-fig{margin:8px 0;text-align:center}
.img-fig img{max-width:100%;border-radius:4px;cursor:zoom-in}
.img-fig figcaption{font-size:13px;color:var(--ink2);outline:none;margin-top:4px;min-height:1.4em}
.img-fig figcaption:empty::before{content:"설명 추가";color:var(--ink3)}
.rawb{border:1px dashed var(--line2);border-radius:6px;padding:6px 10px 8px;margin:6px 0}
.rawb-h{font-size:12px;color:var(--ink3)}
.rawb .cb-code{padding:4px 0 0;background:transparent}
.ng-iimg{background:var(--gray-bg);border-radius:4px;padding:0 4px;font-size:90%}
.pg-kids{margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
.pg-kids-h{font-size:13px;color:var(--ink3);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.pg-kid{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:15px}
.pg-kid:hover{background:var(--hover)}
.pg-kid .t{border-bottom:1px solid rgba(55,53,47,.2)}
.empty-state{max-width:520px;margin:18vh auto 0;text-align:center;color:var(--ink2);padding:0 20px}
.empty-state h2{color:var(--ink);font-size:24px;margin:10px 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1a74cc}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.ro .gut,.ro .tb-tools,.ro .kid-add,.ro .prop-add,.ro .prop-del,.ro .pg-add-icon{display:none!important}
.skeleton{height:14px;background:linear-gradient(90deg,#f1f1ef,#f7f7f5,#f1f1ef);border-radius:4px;margin:12px 0;animation:sk 1.2s infinite}
@keyframes sk{50%{opacity:.5}}

/* popovers & dialogs */
.pop{position:fixed;z-index:60;background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);font-size:14px;padding:6px;max-height:min(420px,60vh);overflow:auto;min-width:220px}
.pop-h{font-size:11.5px;color:var(--ink3);padding:6px 8px 4px;font-weight:600}
.pop-i{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border-radius:5px;text-align:left;color:var(--ink)}
.pop-i .pi{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;flex:none;background:#fff;font-size:14px}
.pop-i small{display:block;color:var(--ink3);font-size:12px;line-height:1.3}
.pop-i.on,.pop-i:hover{background:var(--hover)}
.pop-i.danger{color:var(--red)}
.pop-sep{height:1px;background:var(--line);margin:4px 0}
.fmt{position:fixed;z-index:61;display:flex;background:#fff;border-radius:7px;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);padding:3px}
.fmt button{min-width:30px;height:28px;border-radius:4px;padding:0 7px;font-size:14px}
.fmt button:hover{background:var(--hover)}
.fmt input{border:0;outline:none;width:240px;padding:0 8px;font-size:13px}
.emoji-grid{display:grid;grid-template-columns:repeat(10,32px);gap:2px;padding:4px}
.emoji-grid button{width:32px;height:32px;border-radius:5px;font-size:20px}
.emoji-grid button:hover{background:var(--hover)}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:88vh;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 24px 70px rgba(15,15,15,.25);color:var(--ink)}
dialog::backdrop{background:rgba(15,15,15,.35)}
.dlg{padding:24px 26px 20px}
.dlg h2{margin:0 0 8px;font-size:20px;font-weight:650}
.dlg p{margin:6px 0;color:var(--ink2);font-size:14px;line-height:1.7}
.dlg .notice{background:var(--gray-bg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;color:#504f4b;margin:12px 0}
.dlg .warn{background:var(--yellow-bg);color:#6b5a1e}
.dlg label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.dlg input[type=password],.dlg input[type=text],.dlg input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;font-size:14px;outline:none}
.dlg input:focus{border-color:#74b6f0;box-shadow:0 0 0 3px rgba(35,131,226,.15)}
.dlg .check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13.5px;color:var(--ink2);margin-top:12px}
.dlg .check input{margin-top:4px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.dlg .err{color:var(--red);font-size:13px;min-height:1.2em;margin:8px 0 0}
.dlg ul{margin:6px 0;padding-left:20px;font-size:13.5px;color:var(--ink2)}
.search-dlg{width:min(640px,94vw)}
.search-dlg .dlg{padding:0}
.search-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;outline:none}
.search-res{max-height:55vh;overflow:auto;padding:6px}
.sr{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:6px;cursor:pointer}
.sr.on,.sr:hover{background:var(--hover)}
.sr-ic{width:22px;text-align:center;flex:none}
.sr-t{font-size:14.5px}
.sr-p{font-size:12px;color:var(--ink3)}
.sr-s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.sr-s mark{background:#fbf3db;color:inherit}
.search-foot{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.search-foot button{text-decoration:underline}
.hist{display:grid;grid-template-columns:230px 1fr;gap:0;height:min(70vh,640px)}
.hist-list{border-right:1px solid var(--line);overflow:auto;padding:8px}
.hist-i{padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13px}
.hist-i.on,.hist-i:hover{background:var(--hover)}
.hist-i b{display:block;font-weight:550;font-size:13px}
.hist-i span{color:var(--ink3);font-size:12px}
.hist-view{overflow:auto;padding:12px 24px}
.hist-view .page{padding:0;max-width:none}
.hist-dlg{width:min(1000px,96vw)}
.hist-bar{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.trash-i{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px}
.trash-i:hover{background:var(--hover)}
.trash-i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2f2f2f;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{color:#9ccbf5;font-weight:600}
.drop-cover{position:fixed;inset:0;background:rgba(35,131,226,.08);border:3px dashed #74b6f0;z-index:70;pointer-events:none;display:grid;place-items:center;font-size:18px;color:#24577a}

@media (max-width:900px){
  .page{padding:20px 28px 30vh}
  .gut{left:-26px}
  .gut .g-add{display:none}
  .sb{position:absolute;z-index:40;height:100%;box-shadow:0 0 30px rgba(0,0,0,.15)}
  .app:not(.sb-off) .main::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15);z-index:30}
  .pg-title{font-size:32px}
  .prop-k{width:110px}
  .hist{grid-template-columns:1fr}.hist-list{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}
}
@media print{
  .sb,.top,.gut,.tb-tools,.kid-add,.prop-add,.pg-add-icon,.banner,.pg-meta{display:none!important}
  .app,.scroller{height:auto;overflow:visible;display:block}
  .page{padding:0;max-width:none}
  .blk.toggle>.bd>.kids{display:block!important}
}

  if (!t) return;
  let parent, order;
  if (where === 'in') { parent = tid; const ks = kidsOf(tid); order = ks.length ? (ks[ks.length - 1].order ?? 0) + 1 : 1; ui.expanded[tid] = 1; saveUi(); }
  else {
    parent = t.parent && S.pages.has(t.parent) ? t.parent : null;
    const sib = kidsOf(parent).filter(x => x.id !== id);
    const i = sib.findIndex(x => x.id === tid);
    const a = where === 'before' ? sib[i - 1] : sib[i], b = where === 'before' ? sib[i] : sib[i + 1];

  try { await updateEntry(id, {parent, order}, 'docs: 페이지 위치 바꾸기'); renderSidebar(); if (S.cur) setTop(S.cur); }
  catch (e) { toast('옮기지 못했어요: ' + errorText(e)); }
}

function safeName(name) {

  const base = (m[1] || 'file').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'file';
  return base + (m[2] || '').toLowerCase();
}
async function uploadAndInsert(files, afterBid, replace) {

    const path = 'files/' + cur.id + '/' + Date.now().toString(36) + '-' + safeName(f.name);
    toast('올리는 중… ' + f.name, {ms: 60000});
    try {
      await S.repos[cur.repoKey].writeBytes(path, new Uint8Array(await f.arrayBuffer()), null, 'docs: 첨부 파일 추가 (' + f.name + ')');
      if (S.cur !== cur) return;
      const rel = encodeURI(relPath(cur.path, path));
      pushHistory(true);

      else { nb = MD.newBlock('p'); nb.text = '📎 [' + MD.escapeText(f.name, 'md', ' ', '') + '](' + rel + ')'; }
      const loc = afterBid && findBlock(afterBid);
      if (loc) { if (replace && TEXTUAL.has(loc.b.type) && !loc.b.text) loc.arr.splice(loc.idx, 1, nb); else loc.arr.splice(loc.idx + 1, 0, nb); touchContainer(loc.parent); }
      else cur.page.blocks.push(nb);
      afterBid = nb.id; replace = false;
      rerender(); changed();
      toast('올렸어요: ' + f.name);

  }
}

function newPagePath(repoKey, parentId, id) {
  const parent = parentId && S.pages.get(parentId);

}

function attachmentsOf(text, pagePath) {
  const page = MD.parsePage(text);

  const visit = nodes => { for (const n of nodes || []) { if ((n.t === 'link' && n.href) || (n.t === 'img' && n.src)) { const href = n.href || n.src; if (!/^[a-z][a-z0-9+.-]*:|^#/i.test(href) && !/\.md(#.*)?$/i.test(href) && !href.endsWith('/')) { let p; try { p = decodeURIComponent(href.split(/[?#]/)[0]); } catch { p = href; } out.add(normPath(dirOf(pagePath) + p)); } } if (n.c) visit(n.c); } };
  MD.walkBlocks(page.blocks, b => {
    if (b.text) visit(MD.parseInline(b.text));
    if (b.rows) for (const r of b.rows) for (const c of r) visit(MD.parseInline(c));
    if (b.type === 'image' && b.src && !/^[a-z][a-z0-9+.-]*:/i.test(b.src)) { let p; try { p = decodeURIComponent(b.src); } catch { p = b.src; } out.add(normPath(dirOf(pagePath) + p)); }
  });
  if (page.props) for (const r of page.props.rows) for (const c of r) visit(MD.parseInline(c));

}

async function moveVisibility(id, to, withKids) {
  await leaveCurrent();
  const root = S.pages.get(id);
  const list = [root, ...(withKids ? descendants(id).filter(k => k.repo !== to && !k.trashed) : [])].filter(x => x.repo !== to);
  const dst = S.repos[to];
  let done = 0;
  toast((to === 'public' ? '공개로' : '비공개로') + ' 옮기는 중… 0/' + list.length, {ms: 120000});
  try {
    for (const e of list) {
      const src = S.repos[e.repo];
      const f = await src.readText(e.path);
      if (!f) throw new Error(e.path + ' 파일이 없어요');
      for (const ap of attachmentsOf(f.text, e.path)) {
        const m = await src.meta(ap).catch(() => null);
        if (!m || m.type !== 'file') continue;
        const there = await dst.meta(ap).catch(() => null);
        if (there && there.sha === m.sha) continue;
        const blob = await src.blob(ap);
        await dst.writeBytes(ap, new Uint8Array(await blob.arrayBuffer()), there ? there.sha : null, 'docs: 첨부 파일 복사 (' + ap.split('/').pop() + ')');
      }
      let path = e.path;
      const clash = await dst.meta(path);
      if (clash) path = 'pages/' + e.id + '.md';
      if (path !== e.path && await dst.meta(path)) throw new Error(path + ' 경로가 이미 있어요');
      noteWrite(to, path, f.text, await dst.writeText(path, f.text, null, 'docs: ' + pageTitle(e) + (to === 'public' ? ' 공개' : ' 비공개로 이동')));
      const entry = {...S.man[e.repo].data.pages.find(p => p.id === e.id)};
      entry.path = path;
      await mutateManifest(to, m => { m.pages = m.pages.filter(p => p.id !== e.id); m.pages.push(entry); }, 'docs: ' + pageTitle(e) + (to === 'public' ? ' 공개 목록에 추가' : ' 비공개 목록에 추가'));
      await mutateManifest(e.repo, m => { m.pages = m.pages.filter(p => p.id !== e.id); }, 'docs: ' + pageTitle(e) + ' 목록에서 이동');
      await src.remove(e.path, f.sha, 'docs: ' + pageTitle(e) + (to === 'public' ? ' 공개 저장소로 이동' : ' 비공개 저장소로 이동'));
      if (e.repo === 'public') await cleanupPublicAttachments(attachmentsOf(f.text, e.path));
      done++;
      toast((to === 'public' ? '공개로' : '비공개로') + ' 옮기는 중… ' + done + '/' + list.length, {ms: 120000});
    }
    toast(to === 'public' ? '공개했어요. 링크를 공유할 수 있어요.' : '비공개로 옮겼어요.', to === 'public' ? {action: '링크 복사', onAction: () => copyText(CONFIG.site + '#/p/' + id)} : {});
  } catch (err) {
    toast('옮기는 도중 멈췄어요 (' + done + '/' + list.length + '): ' + errorText(err) + ' — 다시 시도하면 이어서 옮겨요.', {ms: 15000});
  }
  S.cur = null;
  rebuildIndex(); renderChrome(); renderSidebar();
  route();
}
async function cleanupPublicAttachments(paths) {
  if (!paths.length || !S.repos.public) return;
  const still = new Set();
  for (const e of S.man.public.data.pages) {
    const f = await S.repos.public.readText(e.path).catch(() => null);
    if (f) for (const p of attachmentsOf(f.text, e.path)) still.add(p);
  }
  for (const p of paths) {
    if (still.has(p)) continue;
    const m = await S.repos.public.meta(p).catch(() => null);
    if (m && m.type === 'file') await S.repos.public.remove(p, m.sha, 'docs: 비공개로 옮긴 페이지의 첨부 파일 삭제').catch(() => {});
  }
}

/* ---------------------------------------------------------------- dialogs */
function confirmBox({title, body = [], actions = []}) {
  return new Promise(res => {
    const dlg = $('#confirmDlg');
    $('#cfTitle').textContent = title;
    const b = $('#cfBody'); b.innerHTML = ''; b.append(...body.filter(Boolean));
    const a = $('#cfActions'); a.innerHTML = '';
    // Resolve from the click itself: Chrome can deliver the dialog's close event late (seen after IME input),
    // and a late close event must not cancel the next dialog.
    const token = {};
    dlg._token = token;
    let done = false;
    const finish = v => { if (done) return; done = true; res(v); };
    const gated = [];
    for (const act of actions) {
      const btn = h('button', {class: 'btn' + (act.primary ? ' primary' : '') + (act.danger ? ' danger' : ''), type: 'button', text: act.label, onclick: () => { finish(act.value); dlg.close(); }});
      if (act.needs) { btn.disabled = true; gated.push([btn, act.needs]); }
      a.append(btn);
    }
    b.onchange = () => { for (const [btn, sel] of gated) { const x = $(sel); btn.disabled = !(x && x.checked); } };
    dlg.oncancel = () => { if (dlg._token === token) finish(undefined); };
    dlg.onclose = () => { if (dlg._token === token && !dlg.open) finish(undefined); };
    dlg.showModal();
  });
}

/* search */
const search = {sel: 0, items: [], pick: null, full: null};
function openSearch(opts = {}) {
  search.pick = opts.pick || null; search.sel = 0; search.full = null;
  $('#searchIn').value = '';
  $('#searchIn').placeholder = search.pick ? '링크할 페이지 찾기…' : '페이지 검색…';
  renderSearch();

  setTimeout(() => $('#searchIn').focus(), 20);
}
function renderSearch() {
  const q = $('#searchIn').value.trim().toLowerCase();
  const all = [...S.pages.values()].filter(e => !isHidden(e) && (S.mode === 'owner' || e.repo === 'public'));
  let items = all.map(e => ({e, path: ancestors(e).map(pageTitle).join(' / ')}));
  if (q) items = items.filter(x => (pageTitle(x.e) + ' ' + x.path).toLowerCase().includes(q));
  if (search.full && q) {
    for (const [id, snip] of search.full) if (!items.some(x => x.e.id === id)) { const e = S.pages.get(id); if (e) items.push({e, path: ancestors(e).map(pageTitle).join(' / '), snip}); }
    for (const x of items) if (search.full.has(x.e.id)) x.snip = search.full.get(x.e.id);
  }
  items.sort((a, b) => (pageTitle(a.e).toLowerCase().startsWith(q) ? 0 : 1) - (pageTitle(b.e).toLowerCase().startsWith(q) ? 0 : 1));
  search.items = items.slice(0, 60);
  search.sel = Math.min(search.sel, Math.max(0, search.items.length - 1));
  const box = $('#searchRes');
  box.innerHTML = '';
  if (!search.items.length) box.append(h('div', {class: 'sb-empty', style: 'padding:14px', text: q ? '찾는 페이지가 없어요.' : '페이지가 없어요.'}));
  search.items.forEach((x, i) => box.append(h('div', {class: 'sr' + (i === search.sel ? ' on' : ''), dataset: {i}},
    h('span', {class: 'sr-ic', text: pageIcon(x.e)}),
    h('div', {}, h('div', {class: 'sr-t', text: pageTitle(x.e) + (x.e.template ? ' · 템플릿' : '')}), h('div', {class: 'sr-p', text: REPO_LABEL[x.e.repo] + (x.path ? ' · ' + x.path : '')}), x.snip ? h('div', {class: 'sr-s', html: x.snip}) : null))));
}
function chooseSearch(i) {

  if (search.pick) search.pick(x.e); else go(x.e.id);
}
async function fullSearch() {
  const q = $('#searchIn').value.trim();
  if (!q) return toast('검색어를 먼저 입력하세요.');
  const btn = $('#fullSearchBtn');
  btn.textContent = '본문 읽는 중…';
  search.full = new Map();
  const ql = q.toLowerCase();
  const list = [...S.pages.values()].filter(e => !isHidden(e));
  let n = 0;
  await Promise.all(list.map(async e => {
    try {
      const key = e.repo + ':' + e.path;
      let text = S.textCache.get(key);
      if (text == null) { const f = await readEntry(e); text = f ? f.text : ''; S.textCache.set(key, text); }
      const i = text.toLowerCase().indexOf(ql);
      if (i >= 0) { const a = Math.max(0, i - 40); search.full.set(e.id, (a ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, i + q.length + 60)) + '…'); }
    } catch {}
    btn.textContent = '본문 읽는 중… ' + (++n) + '/' + list.length;

  if (S.mode !== 'owner') return;
  $('#listTitle').textContent = '📥 레포 파일 가져오기';
  $('#listIntro').textContent = '저장소에 있지만 노트 목록에 없는 Markdown 파일을 페이지로 등록해요. 파일 내용은 바꾸지 않아요.';

  $('#listDlg').showModal();
  const found = [];
  for (const key of Object.keys(S.repos)) {
    try {
      const t = await S.repos[key].tree();
      const known = new Set(S.man[key].data.pages.map(p => p.path));
      for (const n of t.tree) if (n.type === 'blob' && /\.md$/i.test(n.path) && !known.has(n.path) && !/^\.github\//.test(n.path)) found.push({key, path: n.path});
    } catch (e) { found.push({key, error: errorText(e)}); }
  }
  body.innerHTML = '';
  if (!found.length) { body.append(h('div', {class: 'sb-empty', text: '새로 등록할 Markdown 파일이 없어요.'})); return; }
  for (const f of found) {
    if (f.error) { body.append(h('p', {text: CONFIG.repos[f.key] + ': ' + f.error})); continue; }
    body.append(h('label', {class: 'check', style: 'margin:4px 0'}, h('input', {type: 'checkbox', dataset: {key: f.key, path: f.path}}), h('span', {text: (f.key === 'public' ? '🌐 ' : '🔒 ') + f.path})));

      for (const key of ['private', 'public']) {
        const mine = picked.filter(p => p.key === key);
        if (!mine.length) continue;
        const entries = [];
        for (const p of mine) {
          const f = await S.repos[key].readText(p.path);
          const pg = MD.parsePage(f ? f.text : '');
          entries.push({id: uid(), title: MD.pageTitle(pg) || p.path.replace(/^.*\//, '').replace(/\.md$/i, ''), ...(pg.icon ? {icon: pg.icon} : {}), path: p.path, parent: null, order: nextOrder(null) + entries.length, created: nowIso()});
        }
        await mutateManifest(key, m => { for (const e of entries) if (!m.pages.some(x => x.path === e.path)) m.pages.push(e); }, 'docs: Markdown 파일 ' + entries.length + '개를 노트 목록에 등록');
      }
      $('#listDlg').close();
      renderSidebar();
      toast('등록했어요.');
    } catch (e) { go2.disabled = false; go2.textContent = '선택한 파일 등록'; toast('등록하지 못했어요: ' + errorText(e)); }
  };

function onChange(ev) {

    pushHistory(true);
    loc.b.checked = t.checked; markDirty(loc.b);

function onPaste(ev) {
  const el = textTarget(ev.target);
  if (!el || !S.cur || S.cur.ro) return;
  const role = el.dataset.role;
  if (['code', 'lang', 'raw'].includes(role)) return;
  const files = [...(ev.clipboardData.files || [])];
  if (files.length && role === 'text') { ev.preventDefault(); uploadAndInsert(files, el.dataset.bid, false); return; }
  const text = (ev.clipboardData.getData('text/plain') || '').replace(/\r\n?/g, '\n');
  ev.preventDefault();
  if (!text) return;
  pushHistory(true);
  if (role !== 'text' || !text.includes('\n')) {
    const single = text.replace(/\n+/g, ' ');
    if (role === 'title' || role === 'caption') document.execCommand('insertText', false, single);

function onClick(ev) {

      {label: '링크 없애기', icon: '⨯', run: () => { pushHistory(true); a.replaceWith(...a.childNodes); el.dispatchEvent(new Event('input', {bubbles: true})); }},
    ]);
